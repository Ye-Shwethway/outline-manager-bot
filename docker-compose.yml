services:
  outline-bot:
    container_name: outline-bot
    build:
      context: .
      dockerfile: Dockerfile
    # Hardening: restart on any failure or hang. ``unless-stopped`` is the
    # modern equivalent of ``always`` and respects manual ``docker stop``.
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    read_only: true
    tmpfs:
      - /tmp
    # Hardening: Docker healthcheck relies on the bot touching
    # ``data/.heartbeat`` every ~60s. If the file is older than 5 minutes,
    # the container is considered unhealthy and Docker will recreate it.
    healthcheck:
      test: ["CMD-SHELL", "test \"$$(find /app/data/.heartbeat -mmin -5 2>/dev/null | wc -l)\" -ge 1"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 60s
